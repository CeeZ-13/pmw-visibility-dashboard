<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PMW Visibility Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f6f9;--surface:#fff;--fg:#181a2b;--muted:#5a5d74;--line:#dcdde8;--accent:#3f4aa8;--accent-soft:#e6e8f8;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10111b;--surface:#171926;--fg:#e5e6f0;--muted:#9c9fb6;--line:#2c2f43;--accent:#a3aaf3;--accent-soft:#232848;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:26px 24px 24px;width:min(400px,100%);display:grid;gap:14px}
.eyebrow{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:21px;line-height:1.25;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600}
.field{display:grid;gap:6px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
button:hover{filter:brightness(1.08)}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:13.5px}
.err:empty{display:none}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>

<button id="go" type="submit">Open dashboard</button><div class="err" id="err" role="alert"></div>

document.getElementById("gate").addEventListener("submit", async (e) => {

  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pass").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iterations }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
